services:
  checkmk:
    image: checkmk/check-mk-raw:2.3.0p1
    container_name: checkmk_monitor
    volumes:
      - checkmk_data:/omd/sites
      - /var/run/docker.sock:/var/run/docker.sock
      - honeypot_logs:/app/logs
    networks:
      - red-honeypot
    restart: unless-stopped

  nginx:
    image: nginx:1.25.4-alpine
    container_name: reverse_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx
    networks:
      - red-honeypot
    depends_on:
      - checkmk
      - honeypot
    restart: unless-stopped

  honeypot:
    build: ./honeypot
    container_name: honeypot_app
    volumes:
      - honeypot_logs:/app/logs
    networks:
      - red-honeypot
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden-server
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - ADMIN_TOKEN=$$argon2id$$v=19$$m=65536,t=3,p=4$$c2FsdDEyMzQ1Njc4$$TcMgmBnK/RLtt8VPCCCVdiv7JxIxkgI+fSMKAjdXXNg
    volumes:
      - vaultwarden-data:/data
    networks:
      - red-honeypot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  red-honeypot:
    driver: bridge

volumes:
  checkmk_data:
  honeypot_logs:
  vaultwarden-data:
    driver: local
