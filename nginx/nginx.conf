events {}

http {
    server {
        listen 80;

        # Redirige el tráfico web y ataques al Honeypot
        location / {
            proxy_pass http://honeypot:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirige a Checkmk
        location /cmk/ {
            proxy_pass http://checkmk:5000/cmk/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirige a Vaultwarden
        location /vault/ {
            proxy_pass http://vaultwarden-server:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
