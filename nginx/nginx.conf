events {}

http {
    server {
        listen 80;
        server_name localhost;

        # 1. VAULTWARDEN (La aplicación principal para usuarios normales)
        location / {
            proxy_pass http://vaultwarden-server:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. VAULTWARDEN (Soporte para WebSockets)
        location /notifications/hub {
            proxy_pass http://vaultwarden-server:3012;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 3. CHECKMK (Tu monitorización)
        location /cmk/ {
            proxy_pass http://checkmk:5000/cmk/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. HONEYPOT (La trampa oculta para atacantes)
        location ~* ^/(phpmyadmin|wp-admin) {	
	    rewrite ^ / break;
            proxy_pass http://honeypot:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
